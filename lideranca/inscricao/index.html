<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liderança na Prática · Luana Carvalho</title>
<meta name="description" content="Treinamento online e ao vivo, direto ao ponto, para quem lidera pessoas: feedback, reuniões de alinhamento, conflitos, cobrança de resultados e acompanhamento de indicadores.">
<link rel="icon" type="image/png" href="../assets/favicon.png">
<meta property="og:title" content="Liderança na Prática · Treinamento online ao vivo">
<meta property="og:description" content="Treinamento direto ao ponto para quem lidera pessoas. Com Luana Carvalho.">
<meta property="og:image" content="https://luanacarval.github.io/assets/luana-hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
<script data-goatcounter="https://luanacarval.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
:root{--cream:#FAF5EC;--sand:#F1E4CC;--brick:#873321;--brick-2:#6A2719;--gold:#CB8A2E;--gold-t:#8A5E1A;--ink:#2B1D16;--body:#4A3A30;--muted:#6B5A4E;--line:#E7D9C2;--serif:"Playfair Display",Georgia,serif;--sans:"Jost",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:clip}
body{font-family:var(--sans);color:var(--body);background:var(--cream);line-height:1.7;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:88px 0;border-top:1px solid var(--line)}
.eyebrow{font-weight:500;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-t);margin-bottom:16px}
h1,h2{font-family:var(--serif);font-weight:700;color:var(--brick);line-height:1.1}
h1 em,h2 em{font-style:italic;font-weight:500;color:var(--gold-t)}
h1{font-size:clamp(2.5rem,7vw,4.4rem)}
h2{font-size:clamp(1.9rem,4.4vw,2.8rem);margin-bottom:20px}
h3{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:1.25rem;line-height:1.3}
.lead{font-size:1.2rem;font-weight:300;max-width:640px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:500;letter-spacing:.02em;border-radius:999px;padding:17px 32px;min-height:52px;background:var(--brick);color:var(--cream);transition:background .2s,transform .2s}
.btn:hover{background:var(--brick-2);transform:translateY(-2px)}
.btn-line{background:transparent;color:var(--brick);border:1.5px solid var(--brick)}
.btn-line:hover{background:var(--brick);color:var(--cream)}
header{padding:22px 0}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{width:40px;height:40px}
.brand span{white-space:nowrap;font-family:var(--serif);font-weight:700;color:var(--brick);letter-spacing:.06em}
.hero{border-top:0;padding:56px 0 96px}
.hero .lead{margin:24px 0 36px}
.tags{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:40px;font-size:.95rem;color:var(--muted)}
.tags span{display:flex;align-items:center;gap:8px}
.tags span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold)}
.grid{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px}
.card p{margin-top:8px;font-size:.98rem}
.num{font-family:var(--serif);font-style:italic;color:var(--gold-t);font-size:1.05rem;margin-bottom:10px;display:block}
.list{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:10px}
.list li{display:flex;gap:14px;align-items:flex-start}
.list li::before{content:"";flex:0 0 18px;height:1.5px;background:var(--gold);margin-top:.85em}
.split{display:grid;gap:48px;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));align-items:center}
.photo{border-radius:20px;overflow:hidden;aspect-ratio:4/5;object-fit:cover;width:100%}
.price{display:flex;flex-direction:column;gap:14px}
.price .val{font-family:var(--serif);font-weight:700;color:var(--brick);font-size:2.4rem;line-height:1}
.price .val small{font-family:var(--sans);font-weight:400;font-size:1rem;color:var(--muted)}
.price .btn{margin-top:auto;width:100%}
.price.featured{border:1.5px solid var(--brick)}
.badge{align-self:flex-start;font-size:.75rem;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-t);border:1px solid var(--gold);border-radius:999px;padding:5px 12px}
.note{margin-top:28px;font-size:.95rem;color:var(--muted);text-align:center}
details{border-bottom:1px solid var(--line);padding:20px 0}
details summary{cursor:pointer;font-weight:500;color:var(--ink);list-style:none;display:flex;justify-content:space-between;gap:16px;min-height:44px;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-family:var(--serif);font-size:1.6rem;color:var(--brick);line-height:1}
details[open] summary::after{content:"–"}
details p{margin-top:10px}
.final{text-align:center;background:var(--brick);color:var(--cream);border-top:0}
.final h2{color:var(--cream)}
.final h2 em{color:var(--sand)}
.final .btn{background:var(--cream);color:var(--brick)}
.final .btn:hover{background:var(--sand)}
footer{padding:36px 0;font-size:.9rem;color:var(--muted);text-align:center}
footer a{color:var(--brick)}
@media (max-width:560px){section{padding:64px 0}.hero{padding:32px 0 64px}main .btn{width:100%}.brand span{font-size:.9rem}}
.form-hero{border-top:0;padding:24px 0 8px}
.form-wrap{max-width:760px}
.form-box{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 8px;margin:28px 0 80px}
.steps-mini{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:22px;font-size:.95rem;color:var(--muted)}
.steps-mini b{color:var(--brick);font-weight:500}
</style>
</head>
<body>
<header><div class="wrap nav"><a class="brand" href="../../"><img src="../../assets/logo.png" alt=""><span>LUANA CARVALHO</span></a><a class="btn btn-line" style="padding:10px 18px;min-height:0;white-space:nowrap" href="../">Voltar</a></div></header>
<section class="form-hero"><div class="wrap form-wrap">
  <p class="eyebrow">Liderança na Prática · Inscrição</p>
  <h1 style="font-size:clamp(2rem,5.5vw,3.2rem)">Conte como é a sua <em>liderança hoje</em></h1>
  <p class="lead" style="margin-top:18px">Com as suas respostas, eu monto os encontros de acordo com a sua realidade. Leva cerca de 8 minutos.</p>
  <div class="steps-mini"><span><b>1.</b> Você responde o formulário</span><span><b>2.</b> Recebe as formas de pagamento</span><span><b>3.</b> Marcamos a primeira reunião online</span></div>
  <div class="form-box">
    <iframe data-tally-src="https://tally.so/embed/PRzqW5?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" loading="lazy" width="100%" height="1400" frameborder="0" marginheight="0" marginwidth="0" title="Inscrição · Liderança na Prática"></iframe>
  </div>
</div></section>
<script>
var d=document,w="https://tally.so/widgets/embed.js",v=function(){"undefined"!=typeof Tally?Tally.loadEmbeds():d.querySelectorAll("iframe[data-tally-src]:not([src])").forEach(function(e){e.src=e.dataset.tallySrc})};if("undefined"!=typeof Tally)v();else if(d.querySelector('script[src="'+w+'"]')==null){var s=d.createElement("script");s.src=w,s.onload=v,s.onerror=v,d.body.appendChild(s)}
</script>
</body>
</html>
